# ═══════════════════════════════════════════════════════════════════
# Release — tag-driven production release
#
# Trigger:  push of a semver tag  v*.*.*
# Jobs:
#   validate-tag     → ensure tag is valid semver
#   full-ci          → lint + test + build both projects
#   release-deploy   → deploy frontend (Vercel prod) + backend (Railway prod)
#   create-release   → auto-generate GitHub Release with changelog
# ═══════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Validate tag ───────────────────────────────────────────
  validate-tag:
    name: 🏷️ Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "❌ Invalid semver tag: $TAG"
            exit 1
          fi
          echo "✅ Valid semver: $TAG"

  # ── 2. Full CI (lint + test + build) ─────────────────────────
  full-ci:
    name: 🔁 Full CI Gate
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test
        env:
          VITE_GROQ_API_KEY: ci-test-key

      - name: Build frontend
        run: npm run build
        env:
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          JWT_SECRET: release-ci-secret
          PORT: 4001

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend-${{ github.ref_name }}
          path: build/
          retention-days: 30

  # ── 3. Deploy production ──────────────────────────────────────
  release-deploy:
    name: 🚀 Production Deploy
    runs-on: ubuntu-latest
    needs: full-ci
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-${{ github.ref_name }}
          path: build/

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend to Vercel (production)
        id: vercel-deploy
        run: |
          npm ci
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed frontend to: $URL"
        env:
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway (production)
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for Railway deploy
        run: sleep 90

      - name: Verify production health
        run: |
          echo "Checking backend..."
          curl -sf "${{ secrets.RAILWAY_BACKEND_URL }}/health" && echo "✅ Backend healthy"
          echo "Checking frontend..."
          curl -sf "${{ steps.vercel-deploy.outputs.url }}" > /dev/null && echo "✅ Frontend healthy"

  # ── 4. Create GitHub Release ──────────────────────────────────
  create-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: release-deploy
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-version:refname | grep -v "$TAG" | head -1)
          echo "Generating changelog from $PREV to $TAG"
          if [ -z "$PREV" ]; then
            LOG=$(git log --oneline --no-merges | head -30)
          else
            LOG=$(git log --oneline --no-merges "$PREV..$TAG")
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const isRC = tag.includes('-rc.');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `${tag} — B Airways App`,
              body: `## What's Changed\n\n${process.env.CHANGELOG}\n\n---\n**Frontend:** ${{ secrets.VERCEL_PROD_URL }}\n**Backend:** ${{ secrets.RAILWAY_BACKEND_URL }}`,
              draft: false,
              prerelease: isRC,
            });
        env:
          CHANGELOG: ${{ steps.changelog.outputs.log }}
