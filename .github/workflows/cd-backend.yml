# ═══════════════════════════════════════════════════════════════════
# CD — Deploy Backend to Railway
#
# Triggers:
#   push to main         → production deployment
#   push to develop      → staging deployment
#   workflow_dispatch    → manual deploy
#
# Requires secrets:
#   RAILWAY_TOKEN         — Railway API token (from railway.app → Account Settings)
#   RAILWAY_SERVICE_ID    — Railway service ID for backend
#   RAILWAY_ENV_ID        — Railway environment ID (production / staging)
# ═══════════════════════════════════════════════════════════════════

name: CD — Backend (Railway)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'railway.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ── Smoke test before deploy ──────────────────────────────────
  pre-deploy-test:
    name: 🧪 Pre-deploy Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 4001
          JWT_SECRET: ci-pre-deploy-secret
          JWT_EXPIRES_IN: 1h
          AMADEUS_CLIENT_ID: test
          AMADEUS_CLIENT_SECRET: test

  # ── Deploy to Railway ─────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: pre-deploy-test
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment to go live (60s)
        run: sleep 60

      - name: Post-deploy health check
        run: |
          HEALTH_URL="${{ secrets.RAILWAY_BACKEND_URL }}/health"
          echo "Checking $HEALTH_URL ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Backend health check failed after 5 attempts"
          exit 1

      - name: Verify key API endpoints
        run: |
          BASE="${{ secrets.RAILWAY_BACKEND_URL }}"
          echo "Checking $BASE/api/destinations ..."
          curl -sf "$BASE/api/destinations" > /dev/null && echo "✅ /api/destinations OK"
          echo "Checking $BASE/api/rag/health ..."
          curl -sf "$BASE/api/rag/health" > /dev/null && echo "✅ /api/rag/health OK"

  # ── Rollback on failure ───────────────────────────────────────
  rollback-on-failure:
    name: ⏪ Rollback
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: failure()
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Rollback to previous deployment
        run: railway rollback --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true

      - name: Log rollback
        run: |
          echo "⚠️ Backend deployment FAILED and rollback was triggered"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
